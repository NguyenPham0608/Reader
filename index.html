<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c1b19'/%3E%3Cpath d='M8 14v4M12 10v12M16 7v18M20 11v10M24 14v4' stroke='%23f3f1ec' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f3f1ec;
    --ink: #1c1b19;
    --muted: #77736a;
    --panel: rgba(255, 255, 255, .82);
    --line: rgba(0, 0, 0, .09);
    --soft: rgba(0, 0, 0, .055);
    --paper: #fff;
    --shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 14px 36px -14px rgba(40, 30, 10, .22);
    --hover: rgba(255, 214, 92, .26);
    --active: rgba(255, 214, 92, .2);
    --sentence: rgba(255, 186, 30, .5);
    --zoom: 1;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151517;
      --ink: #eeece8;
      --muted: #96928a;
      --panel: rgba(38, 38, 42, .82);
      --line: rgba(255, 255, 255, .1);
      --soft: rgba(255, 255, 255, .08);
      --paper: #fdfcfa;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 14px 36px -14px rgba(0, 0, 0, .7);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--bg); }
  body { margin: 0; color: var(--ink); min-height: 100vh; -webkit-font-smoothing: antialiased; }
  button, select { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* ── Top bar ─────────────────────────────────────────── */
  .bar {
    position: fixed; inset: 0 0 auto 0; z-index: 20; height: 48px;
    display: flex; align-items: center; gap: 10px; padding: 0 12px;
    background: var(--panel); border-bottom: 1px solid var(--line);
    -webkit-backdrop-filter: saturate(1.6) blur(18px); backdrop-filter: saturate(1.6) blur(18px);
  }
  .doc-title { flex: 1; min-width: 0; font-size: 14px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .page-ind { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .icon-btn {
    width: 32px; height: 32px; flex: none; display: grid; place-items: center;
    border: 0; border-radius: 9px; background: transparent; transition: background .15s, transform .15s, opacity .15s;
  }
  .icon-btn:hover { background: var(--soft); }
  .icon-btn:active { transform: scale(.93); }
  .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .icon-btn:disabled { opacity: .35; cursor: default; }
  .zoom { display: flex; align-items: center; }

  /* ── Welcome ─────────────────────────────────────────── */
  .welcome { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .drop {
    width: min(520px, 100%); padding: 52px 32px 40px; text-align: center;
    border-radius: 28px; background: var(--panel); border: 1px solid var(--line);
    box-shadow: var(--shadow); animation: rise .5s cubic-bezier(.2, .8, .2, 1) both;
  }
  .drop .glyph { width: 56px; height: 56px; margin: 0 auto 22px; border-radius: 16px; display: grid; place-items: center; background: var(--ink); color: var(--bg); }
  .drop .glyph svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .drop h1 { margin: 0 0 8px; font-size: 26px; letter-spacing: -.02em; font-weight: 650; }
  .drop p { margin: 0 auto; max-width: 34ch; color: var(--muted); font-size: 15px; line-height: 1.5; }
  .primary {
    margin-top: 26px; padding: 11px 22px; border: 0; border-radius: 999px;
    background: var(--ink); color: var(--bg); font-weight: 600; font-size: 14.5px; transition: transform .15s, opacity .15s;
  }
  .primary:hover { opacity: .88; }
  .primary:active { transform: scale(.97); }
  .voice-note { margin-top: 22px !important; font-size: 12.5px !important; min-height: 1.5em; font-variant-numeric: tabular-nums; }

  /* ── Pages ───────────────────────────────────────────── */
  .pages {
    display: flex; flex-direction: column; align-items: center; gap: 22px;
    width: max-content; min-width: 100%; padding: 72px 16px 140px;
  }
  .page {
    position: relative; isolation: isolate; flex: none;
    width: calc(min(880px, 100vw - 32px) * var(--zoom));
    background: var(--paper); border-radius: 5px; box-shadow: var(--shadow); overflow: hidden;
  }
  .page canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .35s ease; }
  .page.ready canvas { opacity: 1; }
  .layer { position: absolute; inset: 0; }
  .hl-layer { pointer-events: none; }
  .hl { position: absolute; border-radius: 4px; background: var(--sentence); mix-blend-mode: multiply; animation: fade .22s ease both; }
  .blk {
    position: absolute; padding: 0; border: 0; border-radius: 7px; background: transparent;
    mix-blend-mode: multiply; transition: background .16s ease; -webkit-tap-highlight-color: transparent;
  }
  .blk:hover { background: var(--hover); }
  .blk.active { background: var(--active); }
  .blk.pending { animation: pulse 1.1s ease-in-out infinite; }
  .blk:focus-visible { outline: 2px solid #c98a00; outline-offset: 1px; }

  /* ── Player ──────────────────────────────────────────── */
  .player {
    position: fixed; left: 50%; bottom: 18px; z-index: 30;
    width: min(680px, calc(100vw - 24px)); min-height: 60px; padding: 8px 10px 8px 8px;
    display: flex; align-items: center; gap: 6px; overflow: hidden;
    border-radius: 999px; background: var(--panel); border: 1px solid var(--line);
    box-shadow: 0 2px 6px rgba(0, 0, 0, .06), 0 18px 44px -12px rgba(0, 0, 0, .32);
    -webkit-backdrop-filter: saturate(1.6) blur(20px); backdrop-filter: saturate(1.6) blur(20px);
    transform: translateX(-50%); animation: slide-up .45s cubic-bezier(.2, .8, .2, 1) both;
  }
  .play {
    width: 44px; height: 44px; flex: none; display: grid; place-items: center; position: relative;
    border: 0; border-radius: 50%; background: var(--ink); color: var(--bg); transition: transform .15s;
  }
  .play:active { transform: scale(.93); }
  .play svg { width: 18px; height: 18px; fill: currentColor; }
  .play .i-pause, .player.playing .play .i-play { display: none; }
  .player.playing .play .i-pause { display: block; }
  .player.waiting .play::after {
    content: ""; position: absolute; inset: -3px; border-radius: 50%;
    border: 2px solid transparent; border-top-color: var(--ink); animation: spin .8s linear infinite;
  }
  .now { flex: 1; min-width: 0; padding: 0 8px; }
  .now-text { font-size: 13.5px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now-sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player select {
    appearance: none; -webkit-appearance: none; height: 32px; padding: 0 10px; flex: none;
    border: 0; border-radius: 9px; background: transparent; font-size: 12.5px; font-weight: 550; cursor: pointer; text-align: center;
  }
  .player select:hover { background: var(--soft); }
  .retry { height: 32px; padding: 0 12px; border: 0; border-radius: 9px; background: var(--soft); font-size: 12.5px; font-weight: 600; flex: none; }
  .progress { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--ink); opacity: .55; transition: width .25s ease, opacity .4s ease; }
  .progress.done { opacity: 0; }

  /* ── Overlays ────────────────────────────────────────── */
  .veil {
    position: fixed; inset: 10px; z-index: 50; display: grid; place-items: center; pointer-events: none;
    border-radius: 22px; border: 2px dashed var(--ink); background: color-mix(in srgb, var(--bg) 86%, transparent);
    font-size: 20px; font-weight: 600; opacity: 0; transition: opacity .15s ease;
  }
  .veil.on { opacity: 1; }
  .toast {
    position: fixed; left: 50%; top: 62px; z-index: 60; max-width: min(520px, calc(100vw - 32px));
    padding: 10px 16px; border-radius: 12px; background: var(--ink); color: var(--bg); font-size: 13.5px; line-height: 1.4;
    transform: translate(-50%, -12px); opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @keyframes slide-up { from { opacity: 0; transform: translate(-50%, 24px); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { background: var(--hover); } }

  @media (max-width: 620px) {
    .player .wide { display: none; }
    .pages { padding-left: 8px; padding-right: 8px; gap: 12px; }
    .page { width: calc((100vw - 16px) * var(--zoom)); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01s !important; transition-duration: .01s !important; }
  }
</style>
</head>
<body>

<header class="bar" id="bar" hidden>
  <button class="icon-btn" id="openBtn" title="Open another PDF" aria-label="Open another PDF">
    <svg viewBox="0 0 24 24"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H10l2 2.5h5.5A2.5 2.5 0 0 1 20 10v6.5a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/></svg>
  </button>
  <div class="doc-title" id="docTitle"></div>
  <span class="page-ind" id="pageInd"></span>
  <div class="zoom">
    <button class="icon-btn" id="zoomOut" title="Smaller" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
    <button class="icon-btn" id="zoomIn" title="Larger" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
  </div>
</header>

<main>
  <section class="welcome" id="welcome">
    <div class="drop">
      <div class="glyph"><svg viewBox="0 0 24 24"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></svg></div>
      <h1>Drop a PDF to listen</h1>
      <p>Open any PDF, then click a paragraph to hear it read aloud. Everything runs on this device.</p>
      <button class="primary" id="chooseBtn">Choose a PDF</button>
      <p class="voice-note" id="voiceNote"></p>
    </div>
  </section>
  <div class="pages" id="pages" hidden></div>
</main>

<div class="player" id="player" hidden>
  <button class="play" id="playBtn" aria-label="Play">
    <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.3v13.4a1 1 0 0 0 1.5.86l11-6.7a1 1 0 0 0 0-1.72l-11-6.7A1 1 0 0 0 8 5.3z"/></svg>
    <svg class="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg>
  </button>
  <div class="now">
    <div class="now-text" id="nowText"></div>
    <div class="now-sub" id="nowSub"></div>
  </div>
  <button class="retry" id="retryBtn" hidden>Retry</button>
  <button class="icon-btn wide" id="prevBtn" title="Previous paragraph (←)" aria-label="Previous paragraph"><svg viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></svg></button>
  <button class="icon-btn wide" id="nextBtn" title="Next paragraph (→)" aria-label="Next paragraph"><svg viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></svg></button>
  <button class="icon-btn" id="keepBtn" aria-pressed="false" title="Keep reading after this paragraph" aria-label="Keep reading after this paragraph">
    <svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h8M17 15.5l3 2.5-3 2.5"/></svg>
  </button>
  <select id="voiceSel" class="wide" title="Voice" aria-label="Voice"></select>
  <select id="speedSel" title="Speed" aria-label="Speed"></select>
  <button class="icon-btn" id="stopBtn" title="Stop (Esc)" aria-label="Stop" hidden><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
  <div class="progress" id="progress"></div>
</div>

<div class="veil" id="veil">Drop to open</div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="fileInput" accept="application/pdf,.pdf" hidden>

<script>
  if (location.protocol === 'file:') {
    document.getElementById('voiceNote').textContent =
      'Start it with “python3 serve.py” — the reader needs to run from localhost, not from a file.';
    document.getElementById('chooseBtn').disabled = true;
  }
</script>
<script type="module" src="app.js"></script>
</body>
</html>
