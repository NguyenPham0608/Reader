# Render blueprint: one web service that serves the page and talks to Claude.
# In the Render dashboard choose New > Blueprint and pick this repository.
#
# Anyone with the address can use it, paid for by ANTHROPIC_API_KEY, up to READER_DAILY_BUDGET
# dollars of Claude use a day. To make it private instead, set READER_ACCESS to password and
# add READER_PASSWORD in the dashboard (the GitHub Pages copy then stops working).
services:
  - type: web
    name: reader
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python serve.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: ANTHROPIC_API_KEY
        sync: false # Render asks for it when the blueprint is created
      # Azure's neural voices (optional): the key of an Azure Speech resource and its region,
      # such as westus2. Without them the page's own voices speak.
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        sync: false
      - key: READER_DAILY_BUDGET # dollars a day of Claude and Azure use together
        value: 3
      - key: READER_ACCESS
        value: open
      # Copies of the page allowed to use this server: the GitHub Pages one, and (the word
      # "localhost") one served from your own machine, for testing against this backend.
      - key: READER_ALLOWED_ORIGINS
        value: https://nguyenpham0608.github.io,localhost
